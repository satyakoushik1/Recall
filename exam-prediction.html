<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Exam Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1F2EE; --cream-2:#E9EAE3; --ink:#0C0C09; --salmon:#F6A98C; --muted:#6B6B60; --line:rgba(12,12,9,0.14);
    --red:#C4573B; --orange:#D08A3E; --gray:#9A9A8E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--salmon);}
  a{color:inherit;text-decoration:none;}
  .back{font-size:13.5px;color:var(--muted);}
  .back:hover{color:var(--ink);}

  main{max-width:640px;margin:0 auto;padding:48px 24px 100px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 6px;}
  .predict-status{font-size:13.5px;color:var(--muted);margin:0 0 32px;line-height:1.6;}

  .topic-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
  .topic-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .topic-name{font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;}
  .topic-likelihood{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    padding:4px 10px;border-radius:100px;
  }
  .topic-likelihood.high{background:#FBEDE9;color:var(--red);}
  .topic-likelihood.medium{background:#FBF1E4;color:var(--orange);}
  .topic-likelihood.low{background:var(--cream-2);color:var(--gray);}
  .topic-reason{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0;}

  .spinner-wrap{text-align:center;padding:60px 0;}
  .spinner{
    width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--salmon);
    border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <header>
    <a class="back" href="dashboard.html">← Back</a>
    <div class="logo"><span class="dot"></span>Recall</div>
    <div style="width:50px;"></div>
  </header>
  <main>
    <h1>Exam Prediction</h1>
    <p class="predict-status">Analyzing your notes…</p>
    <div class="predict-container"></div>
  </main>

  <script type="module" src="exam-prediction.js"></script>
</body>
</html>
