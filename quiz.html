<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1F2EE; --cream-2:#E9EAE3; --ink:#0C0C09; --salmon:#F6A98C; --muted:#6B6B60; --line:rgba(12,12,9,0.14);
    --green:#4E8B5C; --red:#C4573B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--salmon);}
  a{color:inherit;text-decoration:none;}
  .back{font-size:13.5px;color:var(--muted);}
  .back:hover{color:var(--ink);}

  main{max-width:640px;margin:0 auto;padding:48px 24px 100px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 6px;}
  .quiz-status{font-size:14px;color:var(--muted);margin:0 0 32px;}

  .quiz-question{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;}
  .question-text{font-size:15.5px;font-weight:600;margin:0 0 16px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option-btn{
    text-align:left;padding:12px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--cream); font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .option-btn:hover:not(:disabled){border-color:var(--salmon);}
  .option-btn:disabled{cursor:default;}
  .option-btn.correct{border-color:var(--green);background:#EAF3EC;}
  .option-btn.incorrect{border-color:var(--red);background:#FBEDE9;}
  .explanation{font-size:13.5px;color:var(--muted);margin:16px 0 0;padding-top:16px;border-top:1px solid var(--line);}

  .popup-overlay{
    position:fixed;inset:0;background:rgba(12,12,9,0.45);
    display:flex;align-items:center;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .popup-overlay.show{opacity:1;pointer-events:auto;}
  .popup-card{
    background:var(--cream);border-radius:24px;padding:48px 40px;text-align:center;
    max-width:340px;width:90%;transform:scale(0.9);transition:transform .25s ease;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
  }
  .popup-overlay.show .popup-card{transform:scale(1);}
  .popup-emoji{font-size:44px;margin-bottom:12px;}
  .popup-title{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0 0 8px;}
  .popup-score{font-size:15px;color:var(--muted);margin:0 0 28px;}
  .popup-btn{
    background:var(--ink);color:var(--cream);border:none;border-radius:100px;
    padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .popup-btn:hover{background:#000;}
</style>
</head>
<body>
  <header>
    <a class="back" href="dashboard.html">← Back</a>
    <div class="logo"><span class="dot"></span>Recall</div>
    <div style="width:50px;"></div>
  </header>
  <main>
    <h1>Quiz</h1>
    <p class="quiz-status">Generating your quiz…</p>
    <div class="quiz-container"></div>
  </main>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-card">
      <div class="popup-emoji">🎉</div>
      <p class="popup-title">Congratulations!</p>
      <p class="popup-score" id="popupScore"></p>
      <button class="popup-btn" id="popupCloseBtn">Done</button>
    </div>
  </div>

  <script type="module" src="quiz.js"></script>
</body>
</html>
