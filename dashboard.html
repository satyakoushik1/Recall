<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Your notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- pdf.js — must load before this page's script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<style>
  :root{
    --cream:#F1F2EE; --cream-2:#E9EAE3; --ink:#0C0C09; --salmon:#F6A98C; --muted:#6B6B60; --line:rgba(12,12,9,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--salmon);}
  a{color:inherit;text-decoration:none;}
  .signout{font-size:13.5px;color:var(--muted);}
  .signout:hover{color:var(--ink);}
  .user-info{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--salmon);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:13px;color:var(--ink);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .user-email{font-size:13px;color:var(--muted);}

  main{max-width:720px;margin:0 auto;padding:64px 24px;}

  .empty-state{text-align:center;padding:60px 24px;}
  .empty-icon{
    width:64px;height:64px;border-radius:18px;background:var(--cream-2);
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
  }
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0 0 10px;letter-spacing:-0.01em;}
  .empty-state p{font-size:14.5px;color:var(--muted);line-height:1.6;margin:0 0 28px;max-width:380px;margin-left:auto;margin-right:auto;}
  .upload-hint{font-size:12.5px !important;color:var(--muted);margin:-16px 0 28px !important;max-width:340px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:var(--cream);
    padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;
    border:none;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn:hover{background:#000;}

  .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap;}
  .list-header h1{margin:0;}
  .add-btn{
    background:var(--ink);color:var(--cream);border:none;border-radius:100px;
    padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .add-btn:hover{background:#000;}
  .predict-btn{
    background:none;color:var(--ink);border:1px solid var(--line);border-radius:100px;
    padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .predict-btn:hover{border-color:var(--salmon);background:var(--cream-2);}

  .note-list{display:flex;flex-direction:column;gap:12px;}
  .note-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
    transition:border-color .15s ease;flex-wrap:wrap;gap:12px;
  }
  .note-title{font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;margin:0 0 4px;}
  .note-status{font-size:12.5px;color:var(--muted);margin:0;display:flex;align-items:center;gap:6px;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .note-card[data-status="ready"] .status-dot{background:#4E8B5C;}
  .note-card[data-status="failed"] .status-dot{background:#C4573B;}
  .note-card[data-status="processing"] .status-dot,
  .note-card[data-status="uploading"] .status-dot{background:var(--salmon);}
  .note-actions{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:14px;}
  .feature-link{
    font-size:13px;font-weight:600;color:var(--ink);padding:6px 12px;
    border-radius:100px;border:1px solid var(--line);
  }
  .feature-link:hover{border-color:var(--salmon);background:var(--cream-2);}
  .retry-btn{
    background:none;border:1px solid var(--line);border-radius:100px;
    padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--ink);
    cursor:pointer;font-family:'Inter',sans-serif;
  }
  .retry-btn:hover{border-color:var(--salmon);background:var(--cream-2);}

  .spinner{
    width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--salmon);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <header>
    <div class="logo"><span class="dot"></span>Recall</div>
    <div class="user-info">
      <div class="avatar" id="avatar"></div>
      <span class="user-email" id="userEmail"></span>
      <a class="signout" href="#" id="signOutBtn">Sign out</a>
    </div>
  </header>

  <main>
    <div id="app"></div>
  </main>

  <input type="file" id="fileInput" accept="application/pdf" style="display:none;" />

  <script type="module">
    import { app as firebaseApp } from "./firebase-init.js";
    import {
      getFirestore, doc, collection, setDoc, updateDoc, serverTimestamp,
      query, where, onSnapshot,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const db = getFirestore(firebaseApp);
    const auth = getAuth(firebaseApp);
    const fileInput = document.getElementById("fileInput");
    const app = document.getElementById("app");

    let currentUser = null;
    let retryNoteId = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }
      currentUser = user;
      renderProfile(user);
      listenToNotes(user.uid);
    });

    function renderProfile(user) {
      const avatar = document.getElementById("avatar");
      const emailEl = document.getElementById("userEmail");
      emailEl.textContent = user.email || "";

      if (user.photoURL) {
        avatar.innerHTML = `<img src="${user.photoURL}" alt="" />`;
      } else {
        const initial = (user.displayName || user.email || "?").charAt(0).toUpperCase();
        avatar.textContent = initial;
      }
    }

    document.getElementById("signOutBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = "auth.html";
    });

    function listenToNotes(uid) {
      const notesQuery = query(collection(db, "notes"), where("uid", "==", uid));
      onSnapshot(notesQuery, (snapshot) => {
        const notes = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        notes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        render(notes);
      }, (err) => {
        console.error("Firestore listener error:", err);
      });
    }

    function render(notes) {
      if (notes.length === 0) {
        app.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5Z" stroke="#0C0C09" stroke-width="1.6"/><path d="M4 5c0-1.1.9-2 2-2h9" stroke="#0C0C09" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <h1>No notes yet</h1>
            <p>Upload a PDF to start asking questions and generating quizzes.</p>
            <p class="upload-hint">Works best with text-based PDFs — typed notes, slides, or textbook exports. Scanned pages or photos of handwriting won't extract properly.</p>
            <button class="btn" id="uploadBtn">Upload your first notes</button>
          </div>
        `;
      } else {
        const statusLabel = {
          uploading: "Uploading…",
          processing: "Reading your notes…",
          ready: "Ready",
          failed: "Failed — tap to retry",
        };

        app.innerHTML = `
          <div class="list-header">
            <h1>Your notes</h1>
            <div style="display:flex;gap:10px;">
              <button class="predict-btn" id="predictBtn">Predict exam topics</button>
              <button class="add-btn" id="uploadBtn">+ Upload</button>
            </div>
          </div>
          <p class="upload-hint" style="margin:-16px 0 24px !important;">Text-based PDFs work best — avoid scanned pages or photos of handwriting.</p>
          <div class="note-list">
            ${notes.map((n) => `
              <div class="note-card" data-status="${n.status}" data-note-id="${n.id}">
                <div>
                  <p class="note-title">${escapeHtml(n.title)}</p>
                  <p class="note-status">
                    <span class="status-dot"></span>
                    ${statusLabel[n.status] || n.status}
                  </p>
                </div>
                <div class="note-actions">
                  ${n.status === "processing" || n.status === "uploading" ? '<div class="spinner"></div>' : ""}
                  ${n.status === "ready" ? `
                    <a class="feature-link" href="chat.html?noteId=${n.id}">Chat</a>
                    <a class="feature-link" href="quiz.html?noteId=${n.id}">Quiz</a>
                    <a class="feature-link" href="flashcards.html?noteId=${n.id}">Flashcards</a>
                  ` : ""}
                  ${n.status === "failed" ? `<button class="retry-btn" data-retry-id="${n.id}">Retry</button>` : ""}
                </div>
              </div>
            `).join("")}
          </div>
        `;

        document.getElementById("predictBtn")?.addEventListener("click", () => {
          const readyIds = notes.filter((n) => n.status === "ready").map((n) => n.id);
          if (readyIds.length === 0) {
            alert("Upload at least one ready note first.");
            return;
          }
          window.location.href = `exam-prediction.html?noteIds=${readyIds.join(",")}`;
        });

        app.querySelectorAll(".retry-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            retryNoteId = btn.dataset.retryId;
            fileInput.click();
          });
        });
      }

      document.getElementById("uploadBtn")?.addEventListener("click", () => {
        retryNoteId = null;
        fileInput.click();
      });
    }

    const MAX_PDF_SIZE = 5 * 1024 * 1024;

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.type !== "application/pdf") {
        alert("Please select a PDF file.");
        fileInput.value = "";
        return;
      }
      if (file.size > MAX_PDF_SIZE) {
        alert("This PDF is too large. Please upload a PDF under 5MB.");
        fileInput.value = "";
        return;
      }
      await processNote(file);
      fileInput.value = "";
    });

    async function processNote(file) {
      const noteRef = retryNoteId
        ? doc(db, "notes", retryNoteId)
        : doc(collection(db, "notes"));

      const baseData = {
        uid: currentUser.uid,
        title: file.name.replace(/\.pdf$/i, ""),
        status: "processing",
        fullText: "",
        pageCount: 0,
      };

      if (retryNoteId) {
        await updateDoc(noteRef, baseData);
      } else {
        await setDoc(noteRef, { ...baseData, createdAt: serverTimestamp() });
      }
      retryNoteId = null;

      try {
        const { text, pageCount } = await extractTextFromPdf(file);

        if (!text || text.trim().length === 0) {
          await updateDoc(noteRef, {
            status: "failed",
            error: "No text found — this PDF may be a scanned image.",
          });
          return;
        }

        await updateDoc(noteRef, { fullText: text, pageCount, status: "ready" });
      } catch (err) {
        console.error("Note processing failed:", err);
        await updateDoc(noteRef, {
          status: "failed",
          error: "Something went wrong reading this PDF.",
        });
      }
    }

    async function extractTextFromPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      let fullText = "";
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        const pageText = content.items.map((item) => item.str).join(" ");
        fullText += pageText + "\n\n";
      }
      return { text: fullText.trim(), pageCount: pdf.numPages };
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
