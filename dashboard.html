<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Your notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1F2EE; --cream-2:#E9EAE3; --ink:#0C0C09; --salmon:#F6A98C; --muted:#6B6B60; --line:rgba(12,12,9,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--salmon);}
  a{color:inherit;text-decoration:none;}
  .signout{font-size:13.5px;color:var(--muted);}
  .signout:hover{color:var(--ink);}
  main{max-width:640px;margin:0 auto;padding:100px 24px;text-align:center;}
  .empty-icon{
    width:64px;height:64px;border-radius:18px;background:var(--cream-2);
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
  }
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0 0 10px;letter-spacing:-0.01em;}
  p{font-size:14.5px;color:var(--muted);line-height:1.6;margin:0 0 28px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:var(--cream);
    padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;
  }
</style>
</head>
<body>
  <header>
    <div class="logo"><span class="dot"></span>Recall</div>
    <a class="signout" href="index.html">Sign out</a>
  </header>
  <main>
    <div class="empty-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5Z" stroke="#0C0C09" stroke-width="1.6"/><path d="M4 5c0-1.1.9-2 2-2h9" stroke="#0C0C09" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <h1>No notes yet</h1>
    <p>Upload a PDF, a slide deck, or a photo of your notes to start asking questions and generating quizzes.</p>
    <button class="btn">Upload your first notes</button>
  </main>
</body>
</html>
